<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frida · figura 3D con IA</title>
<meta name="description" content="Prueba de modelo 3D generado con IA (Tripo H3.1) a partir de la ilustración de Frida Kahlo de Federico Chilian Espinosa.">
<meta name="theme-color" content="#122c6e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@400;600&display=swap">
<style>
:root{--anil:#1b3f9a;--anil-deep:#0f2563;--oro:#f2c14e;--cal:#f7f1e6;--cal-dim:rgba(247,241,230,.72);
  --display:"DM Serif Display",Georgia,serif;--body:"Work Sans",system-ui,-apple-system,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--cal);font-family:var(--body);
  background:radial-gradient(90% 70% at 50% 38%,#2b56bd 0%,var(--anil) 45%,var(--anil-deep) 100%)}
#stage{position:fixed;inset:0}
#stage canvas{touch-action:none;display:block}
header{position:fixed;z-index:5;left:0;right:0;top:0;pointer-events:none;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px))}
header a{pointer-events:auto}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,44px);line-height:1;margin:0}
h1 em{color:var(--oro)}
.meta{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cal-dim);margin-top:6px;font-variant-numeric:tabular-nums}
.note{max-width:36ch;font-size:13px;line-height:1.45;color:var(--cal-dim);margin:8px 0 0}
nav{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
button,nav a{font:600 12px var(--body);letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:11px 16px;cursor:pointer;text-decoration:none;
  background:rgba(10,18,44,.55);color:var(--cal);border:1px solid rgba(247,241,230,.3);backdrop-filter:blur(6px)}
button[aria-pressed="true"]{background:var(--cal);color:#10162a}
button:focus-visible,a:focus-visible{outline:2px solid var(--oro);outline-offset:3px}
a{color:var(--cal)}
#loading{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--cal-dim)}
#loading[hidden]{display:none}
</style>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="stage"></div>
<div id="loading">Cargando el modelo de IA…</div>
<header>
  <h1>Frida <em>con IA</em></h1>
  <div class="meta">Tripo H3.1 vía Higgsfield · optimizado para celular · <span id="stats">—</span></div>
  <p class="note">Generada desde una sola imagen. La IA reconstruyó los costados y la espalda que no están en el dibujo.</p>
</header>
<nav>
  <button id="spin" aria-pressed="true">Girar</button>
  <button id="front">Frente</button>
  <button id="side">Perfil</button>
  <button id="back">Espalda</button>
  <a href="modelo.html">Ver versión por código</a>
</nav>
<script type="module" src="modelo-ia.js"></script>
</body>
</html>
